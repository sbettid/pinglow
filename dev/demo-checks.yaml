apiVersion: pinglow.io/v1alpha1
kind: CheckGroup
metadata:
  name: development
spec:
  displayName: Development
---
apiVersion: pinglow.io/v1alpha1
kind: Script
metadata:
  name: pinglow-dev-heartbeat
spec:
  language: Python
  content: |
    from datetime import datetime, timezone

    now = datetime.now(timezone.utc)
    print(
        f"Pinglow development check is running at {now.isoformat()} "
        f"|hour_utc={now.hour},minute_utc={now.minute}"
    )
---
apiVersion: pinglow.io/v1alpha1
kind: Check
metadata:
  name: pinglow-dev-heartbeat
spec:
  groupRef: development
  scriptRef: pinglow-dev-heartbeat
  interval: 60
---
apiVersion: pinglow.io/v1alpha1
kind: Check
metadata:
  name: pinglow-dev-heartbeat-secondary
spec:
  groupRef: development
  scriptRef: pinglow-dev-heartbeat
  interval: 60
---
apiVersion: pinglow.io/v1alpha1
kind: Check
metadata:
  name: pinglow-dev-agent-heartbeat
spec:
  groupRef: development
  runOn: agent/dev-host
  scriptRef: pinglow-dev-heartbeat
  interval: 60
---
apiVersion: pinglow.io/v1alpha1
kind: ApiKeyBinding
metadata:
  name: pinglow-agent-dev-host
spec:
  role: operator
  agent_target: dev-host
---
apiVersion: pinglow.io/v1alpha1
kind: Check
metadata:
  name: pinglow-dev-host-disk
spec:
  groupRef: development
  runOn: agent/dev-host
  interval: 60
  collector:
    type: disk
    paths: ["/"]
    excludeFilesystemTypes: ["tmpfs", "proc", "sysfs", "devtmpfs"]
    warningPercent: 80
    criticalPercent: 90
---
apiVersion: pinglow.io/v1alpha1
kind: Check
metadata:
  name: pinglow-dev-host-memory
spec:
  groupRef: development
  runOn: agent/dev-host
  interval: 60
  collector:
    type: memory
    warningPercent: 80
    criticalPercent: 90
---
apiVersion: pinglow.io/v1alpha1
kind: Check
metadata:
  name: pinglow-dev-host-load
spec:
  groupRef: development
  runOn: agent/dev-host
  interval: 60
  collector:
    type: load
    periodMinutes: 5
    warningLoad: 2
    criticalLoad: 4
