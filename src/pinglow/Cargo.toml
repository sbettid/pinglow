[package]
name = "pinglow"

# Inherit from workspace
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

default-run = "pinglow"

[features]
openapi-docs = []

[[bin]]
name = "pinglow"
path = "src/main.rs"


[[bin]]
name = "generate-openapi"
path = "bin/generate-openapi.rs"
required-features = ["openapi-docs"]


[dependencies]
pinglow-common = { path = "../common" }

utoipa.workspace = true
schemars.workspace = true
serde.workspace = true
chrono.workspace = true
tokio-postgres.workspace = true
log.workspace = true
anyhow.workspace = true
kube.workspace = true
serde_json.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
redis.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
urlencoding.workspace = true
thiserror.workspace = true
env_logger.workspace = true

futures = "0.3.34"
refinery = {version = "0.10", features = ["tokio-postgres"]}
rocket = { version = "0.5.2", features = ["json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "native-tls-vendored", "http2", "charset", "multipart"] }

dashmap = "6.2.1"
html-escape = "0.3"

base64 = "0.23.1"

[dev-dependencies]
rustfmt = "0.10.0"