apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner
spec:
  replicas: {{ .Values.runner.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-runner
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
      containers:
        - name: {{ .Release.Name }}-runner
          image: "ghcr.io/sbettid/{{ .Release.Name }}-runner:{{ .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsNonRoot: false
            runAsUser: 0
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - name: runner-writable
              mountPath: /home/pinglow-runner
              readOnly: false
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pinglow.redis.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_HOST
              value: "redis"
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      volumes:
        - name: runner-writable
          emptyDir: {}