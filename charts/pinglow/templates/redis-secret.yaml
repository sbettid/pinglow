{{- $controllerSecretName := include "pinglow.redis.secretName" . }}
{{- $runnerSecretName := include "pinglow.runner.redis.secretName" . }}
{{- if or (not .Values.redis.secretName) (not .Values.runner.redis.secretName) }}
{{- $controllerSecret := lookup "v1" "Secret" .Release.Namespace $controllerSecretName }}
{{- $runnerSecret := lookup "v1" "Secret" .Release.Namespace $runnerSecretName }}
{{- $controllerPassword := randAlphaNum 32 | b64enc }}
{{- if and $controllerSecret $controllerSecret.data (hasKey $controllerSecret.data "REDIS_PASSWORD") }}
{{- $controllerPassword = index $controllerSecret.data "REDIS_PASSWORD" }}
{{- end }}
{{- $runnerPassword := randAlphaNum 32 | b64enc }}
{{- if and $runnerSecret $runnerSecret.data (hasKey $runnerSecret.data "REDIS_PASSWORD") }}
{{- $runnerPassword = index $runnerSecret.data "REDIS_PASSWORD" }}
{{- end }}
{{- if not .Values.redis.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $controllerSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
type: Opaque
data:
  REDIS_PASSWORD: {{ $controllerPassword | quote }}
{{- end }}
{{- if not .Values.runner.redis.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runnerSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
type: Opaque
data:
  REDIS_PASSWORD: {{ $runnerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runnerSecretName }}
  namespace: {{ include "pinglow.runner.namespace" . }}
  labels:
    app: redis
type: Opaque
data:
  REDIS_PASSWORD: {{ $runnerPassword | quote }}
{{- end }}
{{- end }}