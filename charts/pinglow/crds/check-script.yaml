apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pinglowuserbindings.pinglow.io
spec:
  group: pinglow.io
  names:
    plural: pinglowuserbindings
    singular: pinglowuserbinding
    kind: PinglowUserBinding
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [viewer, operator, admin]
                subject:
                  type: string
                email:
                  type: string
                groups:
                  type: array
                  items:
                    type: string
                check_groups:
                  type: array
                  items:
                    type: string
                  description: CheckGroup names this binding may access; omitted allows all groups.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: checkgroups.pinglow.io
spec:
  group: pinglow.io
  names:
    plural: checkgroups
    singular: checkgroup
    kind: CheckGroup
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  description: Human-readable name shown for the group in the UI.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apikeybindings.pinglow.io
spec:
  group: pinglow.io
  names:
    plural: apikeybindings
    singular: apikeybinding
    kind: ApiKeyBinding
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [viewer, operator, admin]
                secret_name:
                  type: string
                  description: Existing Secret name to manage; defaults to <binding-name>-api-key.
                check_groups:
                  type: array
                  items:
                    type: string
                  description: CheckGroup names this API key may access; omitted allows all groups.
                agent_target:
                  type: string
                  pattern: "^[A-Za-z0-9-]+$"
                  description: Deprecated single-target form. Use agent_targets to authorize one or more remote-agent targets.
                agent_targets:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9-]+$"
                  description: |
                    If set, this API key is restricted to these remote-agent targets and cannot be used as a user API key.
              x-kubernetes-validations:
                - rule: "!has(self.agent_target) || !has(self.agent_targets)"
                  message: "Set only one of agent_target or agent_targets."
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scripts.pinglow.io
spec:
  group: pinglow.io
  names:
    plural: scripts
    singular: script
    kind: Script
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - language
                - content
              properties:
                language:
                  type: string
                  enum:
                    - Python
                    - Bash
                content:
                  type: string
                python_requirements:
                  type: array
                  items:
                    type: string
                  description: |
                    Optional pip-style requirements. Only used if language is 'python'
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: checks.pinglow.io
spec:
  group: pinglow.io
  names:
    plural: checks
    singular: check
    kind: Check
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                passive:
                  type: boolean
                  default: false
                scriptRef:
                  type: string
                collector:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [disk, memory, load]
                    paths:
                      type: array
                      items:
                        type: string
                      minItems: 1
                    excludeMountPoints:
                      type: array
                      items:
                        type: string
                    excludeFilesystemTypes:
                      type: array
                      items:
                        type: string
                    warningPercent:
                      type: number
                      minimum: 0
                      maximum: 100
                    criticalPercent:
                      type: number
                      minimum: 0
                      maximum: 100
                    warningLoad:
                      type: number
                      minimum: 0
                    criticalLoad:
                      type: number
                      minimum: 0
                    periodMinutes:
                      type: integer
                      enum: [1, 5, 15]
                  x-kubernetes-validations:
                    - rule: "self.type != 'disk' || (has(self.paths) && self.paths.all(path, path.startsWith('/')) && has(self.warningPercent) && has(self.criticalPercent))"
                      message: "Disk collectors require paths and warningPercent/criticalPercent."
                    - rule: "self.type == 'disk' || (!has(self.paths) && !has(self.excludeMountPoints) && !has(self.excludeFilesystemTypes))"
                      message: "Disk-only fields may only be set for disk collectors."
                    - rule: "self.type != 'memory' || (has(self.warningPercent) && has(self.criticalPercent))"
                      message: "Memory collectors require warningPercent/criticalPercent."
                    - rule: "self.type != 'load' || (has(self.warningLoad) && has(self.criticalLoad))"
                      message: "Load collectors require warningLoad/criticalLoad."
                    - rule: "self.type == 'load' || (!has(self.warningLoad) && !has(self.criticalLoad) && !has(self.periodMinutes))"
                      message: "Load-only fields may only be set for load collectors."
                    - rule: "self.type != 'load' || (!has(self.warningPercent) && !has(self.criticalPercent))"
                      message: "Load collectors use warningLoad/criticalLoad, not percentage thresholds."
                    - rule: "!has(self.warningPercent) || !has(self.criticalPercent) || self.warningPercent <= self.criticalPercent"
                      message: "warningPercent must not exceed criticalPercent."
                    - rule: "!has(self.warningLoad) || !has(self.criticalLoad) || self.warningLoad <= self.criticalLoad"
                      message: "warningLoad must not exceed criticalLoad."
                runOn:
                  type: string
                  default: cluster
                  pattern: "^(cluster|agent/[A-Za-z0-9-]+)$"
                interval:
                  type: integer
                  description: "Interval at which to run the check, in seconds"
                groupRef:
                  type: string
                  description: Name of the CheckGroup resource to display this check under.
                secretRefs:
                  type: array
                  items:
                    type: string
                telegramChannelRefs:
                  type: array
                  items:
                    type: string
                  description: Names of TelegramChannel resources to use
                muteNotifications:
                  type: boolean
                  description: whether notifications are muted
                muteNotificationsUntil:
                  type: string
                  format: date-time
                  description: RFC 3339 timestamp indicating when to resume notifications.
              x-kubernetes-validations:
                - rule: "self.passive == true ? (!has(self.scriptRef) && !has(self.collector)) : ((has(self.scriptRef) != has(self.collector)) && has(self.interval))"
                  message: "A passive check must not define a script or collector; an active check must define exactly one of scriptRef or collector and an interval."

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: telegramchannels.pinglow.io
spec:
  group: pinglow.io
  names:
