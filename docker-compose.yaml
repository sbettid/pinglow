services:

  redis:
    image: redis:8
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: pinglow
    ports:
      - "6379:6379"

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: pinglow
      POSTGRES_USER: pinglow
      POSTGRES_PASSWORD: pinglow
      REDIS_PASSWORD: pinglow
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro,Z
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: ["setup"]
    entrypoint: ["/bin/bash", "/opt/keycloak/data/import/configure-groups.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro,Z

volumes:
  timescale-data:
 