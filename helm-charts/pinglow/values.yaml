# Default values for pinglow.

# Secret containing the DB credentials
DBEnvFromSecret: "pinglow-db-env"

# Secret containing OIDC_ISSUER_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET and OIDC_REDIRECT_URL
OidcEnvFromSecret: "pinglow-oidc"

# Secret containing the redis password
RedisPasswordSecret: "pinglow-redis-password"

# Pinglow controller configuration
pinglow:
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Runner configuration
runner:
  minReplicas: 1
  maxReplicas: 10
  # Queue length threshold for scaling
  queueLengthThreshold: 10
  # Minimum queue length to activate scaling
  activationThreshold: 1
  # How often KEDA checks metrics (seconds)
  pollingInterval: 15
  # Wait time before scaling down (seconds)
  cooldownPeriod: 300
  
  # Resource limits
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

# KEDA configuration
keda:
  # Enabling this requires KEDA installed in cluster
  enabled: false

# Optional single-instance TimescaleDB deployment. This is intended for
# development/testing or installations where high availability is not needed.
# For production HA, use an external or operator-managed database instead.
# When enabled, Pinglow uses this instance; when disabled, DBEnvFromSecret is used.
timescaledb:
  enabled: false
  image:
    repository: timescale/timescaledb-ha
    tag: pg18
    pullPolicy: IfNotPresent
  existingSecret: ""
  username: postgres
  database: pinglow
  passwordKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
