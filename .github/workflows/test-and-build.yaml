name: Build and Push Docker Image on Tag

on:
  push:
    tags:
      - "v*"

env:
  BINARY_NAME: pinglow

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }} -p pinglow

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }} -p pinglow-runner

      - name: Build agent with cross
        run: cross build --release --target ${{ matrix.target }} -p pinglow-agent

      - name: Rename binary for Docker build
        run: |
          mkdir -p ./bin/pinglow/${{ matrix.target }}
          mkdir -p ./bin/pinglow-runner/${{ matrix.target }}
          mkdir -p ./bin/pinglow-agent/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pinglow ./bin/pinglow/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/pinglow-runner ./bin/pinglow-runner/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/pinglow-agent ./bin/pinglow-agent/${{ matrix.target }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-pinglow-${{ matrix.target }}
          path: ./bin/pinglow/${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-pinglow-runner-${{ matrix.target }}
          path: ./bin/pinglow-runner/${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-pinglow-agent-${{ matrix.target }}
          path: ./bin/pinglow-agent/${{ matrix.target }}

  docker-runner:
    name: Build and Push Multi-Arch Image for Pinglow runner
    runs-on: ubuntu-latest
    needs: build

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: bin-pinglow-runner-x86_64-unknown-linux-musl
          path: ./bin/bin-pinglow-runner/x86_64-unknown-linux-musl

      - uses: actions/download-artifact@v8
        with:
          name: bin-pinglow-runner-aarch64-unknown-linux-musl
          path: ./bin/bin-pinglow-runner/aarch64-unknown-linux-musl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: extract_tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Verify binary architecture
        run: |
          file ./bin/bin-pinglow-runner/aarch64-unknown-linux-musl/pinglow-runner
          file ./bin/bin-pinglow-runner/x86_64-unknown-linux-musl/pinglow-runner


      - name: Build and Push Multi-Arch Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BINARY_NAME=${{ env.BINARY_NAME }}-runner \
            --build-context bin_amd64=./bin/bin-pinglow-runner/x86_64-unknown-linux-musl \
            --build-context bin_arm64=./bin/bin-pinglow-runner/aarch64-unknown-linux-musl \
            -t ghcr.io/${{ github.repository }}-runner:${{ env.VERSION }} \
            --push \
            -f ./src/pinglow-runner/Dockerfile.multiarch .

  docker-pinglow:
    name: Build and Push Multi-Arch Image for Pinglow
    runs-on: ubuntu-latest
    needs: build

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: bin-pinglow-x86_64-unknown-linux-musl
          path: ./bin/bin-pinglow/x86_64-unknown-linux-musl

      - uses: actions/download-artifact@v8
        with:
          name: bin-pinglow-aarch64-unknown-linux-musl
          path: ./bin/bin-pinglow/aarch64-unknown-linux-musl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: extract_tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Verify binary architecture
        run: |
          file ./bin/bin-pinglow/aarch64-unknown-linux-musl/pinglow
          file ./bin/bin-pinglow/x86_64-unknown-linux-musl/pinglow


      - name: Build and Push Multi-Arch Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BINARY_NAME=${{ env.BINARY_NAME }} \
            --build-context bin_amd64=./bin/bin-pinglow/x86_64-unknown-linux-musl \
            --build-context bin_arm64=./bin/bin-pinglow/aarch64-unknown-linux-musl \
            -t ghcr.io/${{ github.repository }}:${{ env.VERSION }} \
            --push \
            -f ./src/pinglow/Dockerfile.multiarch .

  build-doc:
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate openapi specification
        run: cargo run -p pinglow --bin generate-openapi --features openapi-docs

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Generate dyanmic openapi menu
        working-directory: docs
        run: python src/scripts/generateOpenapiMenu.py

      - name: Build the doc
        working-directory: docs
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build-doc

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - docker-runner
      - docker-pinglow
      - deploy

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set release versions
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          cargo = Path("Cargo.toml")
          cargo.write_text(re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', cargo.read_text(), count=1))

          chart = Path("charts/pinglow/Chart.yaml")
          text = chart.read_text()
          text = re.sub(r'(?m)^version: .+$', f'version: {version}', text, count=1)
          text = re.sub(r'(?m)^appVersion: ".+"$', f'appVersion: "v{version}"', text, count=1)
          chart.write_text(text)
          PY

      - name: Package Helm chart
        run: |
          helm dependency update charts/pinglow
          helm lint charts/pinglow
          mkdir -p chart-packages
          helm package charts/pinglow --destination chart-packages

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: chart-packages/pinglow-*.tgz

      - name: Download agent binaries
        uses: actions/download-artifact@v8
        with:
          name: bin-pinglow-agent-x86_64-unknown-linux-musl
          path: release-assets/agent/amd64

      - uses: actions/download-artifact@v8
        with:
          name: bin-pinglow-agent-aarch64-unknown-linux-musl
          path: release-assets/agent/arm64

      - name: Package Linux agent releases
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets/packages/amd64 release-assets/packages/arm64
          for arch in amd64 arm64; do
            stage="release-assets/stage-$arch"
            mkdir -p "$stage"
            cp "release-assets/agent/$arch/pinglow-agent" "$stage/"
            cp src/pinglow-agent/agent.example.yaml "$stage/agent.example.yaml"
            cp docs/static/downloads/pinglow-agent.service "$stage/"
            cp docs/docs/deployment/agent.md "$stage/INSTALL.md"
            tar -C "$stage" -czf "release-assets/packages/pinglow-agent-${VERSION}-linux-${arch}.tar.gz" .
          done
          (cd release-assets/packages && sha256sum pinglow-agent-*.tar.gz > SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            chart-packages/pinglow-*.tgz \
            release-assets/packages/pinglow-agent-*.tar.gz \
            release-assets/packages/SHA256SUMS \
            --generate-notes
