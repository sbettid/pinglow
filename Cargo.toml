# Cargo.toml
[workspace]
members = [
  "src/pinglow",
  "src/pinglow-runner",
  "src/common"
]

resolver = "2"

[workspace.package]
version = "0.16.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/sbettid/pinglow"

[workspace.dependencies]
utoipa = {version = "6", features = ["chrono"]}
serde = { version = "1.0.229", features = ["derive", "rc"] }
schemars = {version = "1.2.3", features = ["chrono04"]}
chrono = {version = "0.4.45", features = ["serde"]}
tokio-postgres = {version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"]}
log = {version = "0.4.34"}
anyhow = "1.0.104"
kube = { version = "4", features = ["derive", "runtime"] }
serde_json = "1.0.154"
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
tokio = { version = "1.54.1", features = ["full"] }
redis = { version = "1.8.1", features = ["tokio-comp"] }
thiserror = "2.0.21"
env_logger = "0.11.11" 
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
urlencoding = "2.1.3"
